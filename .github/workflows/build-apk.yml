name: Build NULL Messenger

on:
  push:
    branches: [main, master, null-messenger-cross-platform]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build debug APK
        run: gradle :androidApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NULL-Messenger-Android
          path: androidApp/build/outputs/apk/debug/*.apk

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build Windows MSI
        run: gradle :desktopApp:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NULL-Messenger-Windows
          path: desktopApp/build/compose/binaries/main/msi/*.msi
